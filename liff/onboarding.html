<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入職程序 - KARBØN X GAIA ORBIT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/line-liff/2.0.0/liff.min.js"></script>
  <style>
    body { margin:0; padding:20px; background:#05050a; color:white; font-family:system-ui; }
    .glass { background:rgba(10,10,20,0.9); backdrop-filter:blur(20px); border:1px solid rgba(103,232,249,0.4); border-radius:24px; padding:24px; }
    input, select { width:100%; padding:14px; margin:10px 0; background:rgba(255,255,255,0.1); border:1px solid #67e8f9; border-radius:12px; color:white; }
    button { width:100%; padding:16px; background:#67e8f9; color:#000; font-size:18px; font-weight:bold; border:none; border-radius:16px; margin-top:20px; }
    .upload-area { border:2px dashed #67e8f9; padding:20px; text-align:center; border-radius:16px; margin:12px 0; }
  </style>
</head>
<body>
  <div class="glass">
    <h1 style="text-align:center; color:#67e8f9;">🌌 入職程序</h1>
    <p style="text-align:center; color:#aaa;">請完整填寫以下資料</p>

    <form id="form">
      <input type="text" id="fullName" placeholder="姓名" required>
      <input type="text" id="englishName" placeholder="英文名" required>
      <input type="date" id="birthday" required>
      <input type="tel" id="phone" placeholder="手機號碼" required>
      <input type="text" id="department" placeholder="部門 / 職稱" required>

      <div class="upload-area">
        <p>上傳身分證正反面</p>
        <input type="file" id="idCard" accept="image/*" required>
      </div>

      <div class="upload-area">
        <p>上傳存摺封面與內頁</p>
        <input type="file" id="bankBook" accept="image/*" required>
      </div>

      <button type="submit">送出入職資料</button>
    </form>
  </div>

  <script>
    let lineUserId = "";

    async function initLiff() {
      await liff.init({ liffId: "2010149593-DyntMxoX" });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        lineUserId = profile.userId;
      } else {
        liff.login();
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const idCardFile = document.getElementById('idCard').files[0];
      const bankBookFile = document.getElementById('bankBook').files[0];

      const idCardBase64 = idCardFile ? await fileToBase64(idCardFile) : null;
      const bankBookBase64 = bankBookFile ? await fileToBase64(bankBookFile) : null;

      const payload = {
        lineUserId: lineUserId,
        fullName: document.getElementById('fullName').value,
        englishName: document.getElementById('englishName').value,
        birthday: document.getElementById('birthday').value,
        phone: document.getElementById('phone').value,
        department: document.getElementById('department').value,
        idCardBase64: idCardBase64,
        bankBookBase64: bankBookBase64
      };

      // 送給 GAS
      const response = await fetch('https://script.google.com/macros/s/AKfycbytDkvfXSFIhOxOQKx8LAOtdu3MJKGWUPw3T9xu_jAQNbrVE6EcKEsqINOkw_AIU7wQ/exec', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert('✅ 入職資料已成功送出！\n請等待 HR 審核通過。');
        window.location.href = "https://kayon-hub.github.io/kayon-orbit/liff/onboarding-complete.html";
      } else {
        alert('❌ 送出失敗，請稍後再試');
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    window.onload = initLiff;
  </script>
</body>
</html>
