<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KXG ORBIT • 員工自助入職系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      background-color: #05050a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* 液態玻璃光暈效果 */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .neon-glow {
      box-shadow: 0 0 20px rgba(103, 233, 249, 0.15);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-200">

  <div class="w-full max-w-xl glass-card rounded-3xl p-6 sm:p-8 space-y-6 neon-glow my-8">
    
    <div class="text-center space-y-2">
      <div class="text-cyan-400 font-bold tracking-widest text-xs uppercase">KARBØN X GAIA</div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">ORBIT 自助入職系統</h1>
      <p class="text-sm text-slate-400">歡迎加入未來工作空間。請填寫基本資料並拍照上傳必要證件。</p>
    </div>

    <form id="onboardingForm" class="space-y-5">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400 tracking-wider">中文姓名</label>
          <input type="text" id="fullName" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 text-sm transition-colors" placeholder="請輸入姓名">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400 tracking-wider">英文姓名</label>
          <input type="text" id="englishName" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 text-sm transition-colors" placeholder="e.g. Raymond">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400 tracking-wider">出生年月日</label>
          <input type="date" id="birthday" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 text-sm transition-colors">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400 tracking-wider">手機號碼</label>
          <input type="tel" id="phone" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 text-sm transition-colors" placeholder="0912345678">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-400 tracking-wider">預計任職部門 / 職稱</label>
        <input type="text" id="department" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 text-sm transition-colors" placeholder="e.g. Sales / HR">
      </div>

      <div class="border-t border-white/5 pt-4 space-y-4">
        <h3 class="text-sm font-bold text-cyan-400">📁 證明文件拍照上傳</h3>
        
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-400 tracking-wider block">身分證照片</label>
          <input type="file" id="idCard" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 file:transition-colors cursor-pointer">
        </div>

        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-400 tracking-wider block">台幣存摺封面照片</label>
          <input type="file" id="bankBook" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 file:transition-colors cursor-pointer">
        </div>
      </div>

      <div class="pt-4">
        <button type="submit" id="submitBtn" class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-cyan-400/10 hover:shadow-cyan-400/20 text-sm tracking-widest cursor-pointer">
          🌌 確認送出資料，開通權限
        </button>
      </div>

    </form>
  </div>

  <script>
    // 輔助函式：將上傳的圖片檔案轉為 Base64 字串
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) resolve(null);
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // 初始化 LINE LIFF
    async function initLIFF() {
      try {
        await liff.init({ liffId: "2010149593-DyntMxoX" });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (error) {
        console.error("LIFF 初始化失敗:", error);
        alert("LIFF 初始化失敗，請於 LINE 內開啟此網頁。");
      }
    }

    // 監聽表單送出事件
    document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "🌌 系統極速傳輸中，請稍候...";
      submitBtn.disabled = true;

      try {
        // 確保 LIFF 正常拿得到使用者 profile
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;

        // 讀取並轉換圖片檔案
        const idCardFile = document.getElementById('idCard').files[0];
        const bankBookFile = document.getElementById('bankBook').files[0];
        
        const idCardBase64 = await fileToBase64(idCardFile);
        const bankBookBase64 = await fileToBase64(bankBookFile);

        // 打包與後端 onboarding.gs 欄位完全對齊的 JSON 資料包
        const payload = {
          lineUserId: lineUserId,
          fullName: document.getElementById('fullName').value,
          englishName: document.getElementById('englishName').value,
          birthday: document.getElementById('birthday').value,
          phone: document.getElementById('phone').value,
          department: document.getElementById('department').value,
          idCardBase64: idCardBase64,
          bankBookBase64: bankBookBase64
        };

        // 🔗 你的 Apps Script 專案第 25 版最新網頁應用程式部署網址
        const GAS_URL = "
