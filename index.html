<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>ORBIT · 登入</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --surface2: #16161f;
      --border:   rgba(255,255,255,0.07);
      --gold:     #c9a84c;
      --gold-dim: #8a6e2f;
      --white:    #f0ede8;
      --muted:    rgba(240,237,232,0.4);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
    }

    /* ── 背景格線 ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-glow {
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      z-index: 0;
    }

    /* ── 主體 ── */
    .container {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    /* ── Logo 區 ── */
    .logo-wrap {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeUp 0.8s ease both;
    }

    .logo-emblem {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 1.5px solid var(--gold-dim);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      position: relative;
    }

    .logo-emblem::before {
      content: '';
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.15);
    }

    .logo-emblem-letter {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    .logo-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 0.25em;
      color: var(--white);
      margin-bottom: 6px;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── 登入卡片 ── */
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      animation: fadeUp 0.8s ease 0.15s both;
    }

    .card-label {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    /* ── LINE 登入按鈕 ── */
    .btn-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: #06C755;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(6,199,85,0.25);
      margin-bottom: 24px;
    }

    .btn-line:hover {
      background: #05b84d;
      box-shadow: 0 6px 28px rgba(6,199,85,0.35);
    }

    .btn-line:active { transform: scale(0.98); }

    .btn-line svg {
      width: 22px; height: 22px;
      flex-shrink: 0;
    }

    /* ── 分隔線 ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    /* ── 版本 ── */
    .version-tag {
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(201,168,76,0.5);
    }

    /* ── 底部 ── */
    .footer {
      margin-top: 40px;
      text-align: center;
      animation: fadeUp 0.8s ease 0.3s both;
    }

    .footer-brand {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .footer-powered {
      font-size: 10px;
      color: var(--muted);
    }

    /* ── SSL Badge ── */
    .ssl-badge {
      position: fixed;
      bottom: 24px; right: 24px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 12px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="container">

  <div class="logo-wrap">
    <div class="logo-emblem">
      <span class="logo-emblem-letter">K</span>
    </div>
    <div class="logo-name">ORBIT</div>
    <div class="logo-sub">KAYON ORBIT AI ERP · AI WORKSPACE</div>
  </div>

  <div class="login-card">
    <div class="card-label">員工系統入口</div>
    <div class="card-title">以 LINE 身份登入</div>
    <div class="card-desc">
      使用你的 LINE 帳號進行身份驗證，<br>
      系統將自動識別你的員工權限。
    </div>

    <button class="btn-line" id="btnLogin" onclick="lineLogin()">
      <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.06 2 11.07c0 4.49 3.66 8.25 8.62 8.93.34.07.8.22.91.5.1.26.07.66.03.92l-.15.87c-.05.26-.22 1.03.9.56 1.12-.47 6.03-3.55 8.23-6.08C21.63 14.88 22 13.03 22 11.07 22 6.06 17.52 2 12 2z"/>
      </svg>
      以 LINE 帳號登入
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">KAYON ORBIT v1.0</div>
      <div class="divider-line"></div>
    </div>

    <div class="version-tag">
      登入即代表你同意 KAYON ORBIT AI ERP<br>員工系統使用條款與隱私政策
    </div>
  </div>

  <div class="footer">
    <div class="footer-brand">KARBØN × GAIA ENTERTAINMENT</div>
    <div class="footer-powered">Powered by ORBIT AI System</div>
  </div>

</div>

<div class="ssl-badge">
  🔒 安全連線中 · SSL 加密保護
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  liff.init({ liffId: '2010149593-DyntMxoX' }).then(() => {
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: 'https://kayon-hub.github.io/kayon-orbit/app.html' });
    } else {
      window.location.href = 'app.html';
    }
  });
</script>
</body>
</html>
